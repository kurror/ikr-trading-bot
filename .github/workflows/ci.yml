name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for SonarCloud blame data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install fastapi httpx pytest pytest-cov ruff
          pip install -r trading-bot/requirements.txt
          ln -sf trading-bot trading_bot

      - name: Lint (ruff)
        run: ruff check trading-bot/ tests/ lumibot/

      - name: Test with coverage
        run: pytest tests/ --cov=trading_bot --cov-report=xml:coverage.xml

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
